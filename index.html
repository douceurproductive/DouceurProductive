<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douceur Productive | Une approche douce de la productivité</title>
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #f8e1e7 0%, #e6f0f9 100%);
            --accent-color: #a7c5e3;
            --text-color: #5b6b8c;
            --button-color: #a7c5e3;
            --highlight: #f4adb5;
            --card-bg: #f8f9fc;
            --shadow: rgba(149, 157, 165, 0.1);
            --font-main: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: var(--font-main);
            background: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        header {
            padding: 1.5rem 0;
            text-align: center;
            position: relative;
        }
        
        nav {
            display: flex;
            justify-content: center;
            padding: 1rem 0;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            font-size: 1.1rem;
        }
        
        nav a:hover {
            color: var(--highlight);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color);
        }
        
        .logo span {
            color: var(--highlight);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4rem 0;
            flex-wrap: wrap;
        }
        
        .hero-content {
            flex: 1;
            min-width: 300px;
            padding-right: 2rem;
        }
        
        .hero-image {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }
        
        .hero-image img {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }
        
        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        
        .cta-button {
            display: inline-block;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(167, 197, 227, 0.4);
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(167, 197, 227, 0.6);
        }
        
        .features {
            padding: 4rem 0;
            background-color: var(--card-bg);
            border-radius: 30px;
            margin: 2rem 0;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        
        .feature-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-10px);
        }
        
        .feature-icon {
            background: var(--accent-color);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        
        .feature-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        
        .feature-title {
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }
        
        .testimonials {
            padding: 4rem 0;
        }
        
        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .testimonial-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        
        .testimonial-text {
            font-style: italic;
            margin-bottom: 1.5rem;
        }
        
        .testimonial-author {
            display: flex;
            align-items: center;
        }
        
        .author-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-color);
            margin-right: 1rem;
        }
        
        .author-name {
            font-weight: 600;
        }
        
        .pricing {
            padding: 4rem 0;
            background-color: var(--card-bg);
            border-radius: 30px;
            margin: 2rem 0;
        }
        
        .price-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .price-header {
            margin-bottom: 2rem;
        }
        
        .price-name {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
        
        .price-amount {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }
        
        .price-period {
            opacity: 0.7;
        }
        
        .price-features {
            margin-bottom: 2rem;
            flex-grow: 1;
        }
        
        .price-features ul {
            list-style: none;
            padding: 0;
        }
        
        .price-features li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .price-cta {
            margin-top: auto;
        }
        
        .secondary-button {
            display: inline-block;
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .secondary-button:hover {
            background-color: var(--accent-color);
            color: white;
        }
        
        .faq {
            padding: 4rem 0;
        }
        
        .faq-item {
            margin-bottom: 1.5rem;
        }
        
        .faq-question {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .faq-question::after {
            content: '+';
            font-size: 1.5rem;
        }
        
        .faq-answer {
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        footer {
            background-color: #4a5568;
            color: white;
            padding: 3rem 0;
            margin-top: 4rem;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
        }
        
        .footer-column {
            flex: 1;
            min-width: 200px;
        }
        
        .footer-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: white;
        }
        
        .footer-links {
            list-style: none;
        }
        
        .footer-links li {
            margin-bottom: 0.5rem;
        }
        
        .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: white;
        }
        
        .copyright {
            text-align: center;
            padding-top: 2rem;
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                gap: 2rem;
            }
            
            .hero-content {
                padding-right: 0;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            h2 {
                font-size: 1.8rem;
            }
            
            .feature-grid, .testimonial-grid, .price-grid {
                grid-template-columns: 1fr;
            }
            
            nav ul {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        
        .app-preview-container {
            margin: 4rem 0;
            text-align: center;
        }
        
        .app-preview {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        .app-header {
            background: var(--accent-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .app-content {
            padding: 2rem;
        }
        
        .app-task {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        
        .task-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--highlight);
            margin-right: 1rem;
        }
        
        .app-button {
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 1rem;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1.5rem;
        }
        
        /* Animation pour le bouton d'essai */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .animated-button {
            animation: pulse 2s infinite;
        }
